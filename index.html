<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#111"><title>Mr. Brown Restaurant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#222;font-family:Arial,sans-serif}header{background:#111;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}header b{font-size:21px}.wrap{max-width:1150px;margin:auto;padding:15px}.tabs{display:flex;gap:7px;margin-bottom:14px}.tabs button{flex:1}.active,.primary{background:#111!important;color:#fff!important}.card{background:#fff;border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}h2{font-size:18px;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;border-radius:10px;background:#f7f7f7}.stat b{font-size:21px;display:block;margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row3{display:grid;grid-template-columns:2fr 80px 100px;gap:9px;margin-top:10px}label{display:block;font-size:12px;font-weight:bold;margin:5px 0}input,select,button{font:inherit}input,select,button{padding:10px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer;background:#eee}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}table{width:100%;border-collapse:collapse;margin-top:14px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.total{text-align:right;font-size:23px;font-weight:bold;margin:13px 0}.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.hide{display:none}.muted{color:#777;font-size:13px}.danger{color:#a00;background:#fff0f0}.receipt{max-width:420px;margin:auto}.receipt h1{text-align:center}.receipt p{text-align:center;margin:4px}.receipt .line{border-top:1px dashed #888;margin:10px 0}.login{max-width:420px;margin:40px auto;text-align:center}@media(max-width:650px){.row,.row3,.stats{grid-template-columns:1fr}.wrap{padding:9px}.actions button{flex:unset}.tabs button{padding:10px 5px;font-size:12px}}@media print{header,.tabs,.no-print{display:none!important}.card{box-shadow:none}.print-only{display:block!important}}
.print-only{display:none}
</style></head><body>
<div id=app>
<header><b>Mr. Brown Restaurant</b><span>Pro Billing</span></header><div class=wrap>
<div class="tabs no-print"><button id=a class=active onclick=tab('dash')>📊 Dashboard</button><button id=b onclick=tab('bill')>🧾 New Bill</button><button id=c onclick=tab('menu')>🍽️ Menu</button><button id=d onclick=tab('hist')>📋 Bills</button></div>
<section id=dash class=card><h2>Today</h2><div class=stats><div class=stat>Sales<b id=sales>₹0</b></div><div class=stat>Bills<b id=count>0</b></div><div class=stat>Average<b id=avg>₹0</b></div></div></section>
<section id=bill class="card hide"><h2>New Bill</h2><div class=row><div><label>Bill No.</label><input id=no readonly></div><div><label>Date / Time</label><input id=date readonly></div></div><div class=row style="margin-top:8px"><div><label>Customer</label><input id=customer placeholder="Optional"></div><div><label>Table / Order No.</label><input id=table placeholder="T-1"></div></div><div class=row3><select id=sel></select><input id=qty type=number min=1 value=1><button class=primary onclick=add()>Add</button></div><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody id=cart></tbody></table><div class=row style="margin-top:10px"><div><label>Discount ₹</label><input id=disc type=number min=0 value=0 oninput=render()></div><div><label>Payment</label><select id=pay><option>Cash</option><option>UPI</option><option>Card</option></select></div></div><div id=total class=total></div><div class="actions no-print"><button class=primary onclick=save()>💾 Save</button><button onclick=printBill()>🖨️ Print</button><button onclick=fresh()>New Bill</button></div></section>
<section id=menu class="card hide no-print"><h2>Menu Management</h2><div class=row><input id=mn placeholder="Item name"><input id=mp type=number min=0 placeholder="Price ₹"></div><div class=actions><button class=primary onclick=addMenu()>➕ Add Item</button></div><div id=menuList></div></section>
<section id=hist class="card hide no-print"><h2>Bill History</h2><input id=search placeholder="Search bill/customer/table..." oninput=history()><div id=historyList></div></section>
<div id=printArea class=print-only></div>
</div></div>
<script>
let M=[],C=[],B=[],$=x=>document.getElementById(x),money=n=>'₹'+(+n).toFixed(2);
async function api(u,o){return fetch(u,o).then(r=>r.json())}
async function load(){M=await api('/api/menu');B=await api('/api/bills');$('sel').innerHTML='<option value="">Select item</option>'+M.map((x,i)=>`<option value=${i}>${x.name} — ${money(x.price)}</option>`).join('');menuList();meta();render();dashboard();history()}
function meta(){$('no').value='MB-'+String(B.length+1).padStart(4,'0');$('date').value=new Date().toLocaleString('en-IN')}
function add(){let i=+$('sel').value,q=+$('qty').value;if(!M[i]||q<1)return alert('Item select karein');C.push({...M[i],qty:q});render()}
function render(){let sub=C.reduce((a,x)=>a+x.price*x.qty,0),d=+$('disc').value||0,t=Math.max(0,sub-d);$('cart').innerHTML=C.map((x,i)=>`<tr><td>${x.name}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.price*x.qty)}</td><td><button class=danger onclick="C.splice(${i},1);render()">×</button></td></tr>`).join('');$('total').innerHTML=`Subtotal ${money(sub)}<br><small>Discount -${money(d)}</small><br>Grand Total ${money(t)}`}
async function save(){if(!C.length)return alert('Item add karein');let sub=C.reduce((a,x)=>a+x.price*x.qty,0),d=+$('disc').value||0;await api('/api/bills',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bill_no:$('no').value,date:$('date').value,customer:$('customer').value,table_no:$('table').value,payment:$('pay').value,subtotal:sub,discount:d,total:Math.max(0,sub-d),items:C})});alert('Bill saved successfully');load()}
function printBill(){if(!C.length)return alert('Item add karein');let sub=C.reduce((a,x)=>a+x.price*x.qty,0),d=+$('disc').value||0,t=Math.max(0,sub-d);$('printArea').innerHTML=`<div class=receipt><h1>Mr. Brown Restaurant</h1><p>Bill: ${$('no').value}</p><p>${$('date').value}</p><p>Customer: ${$('customer').value||'-'} | Table: ${$('table').value||'-'}</p><div class=line></div>${C.map(x=>`<div>${x.name} × ${x.qty} <span style="float:right">${money(x.price*x.qty)}</span></div>`).join('')}<div class=line></div><div>Subtotal <span style="float:right">${money(sub)}</span></div><div>Discount <span style="float:right">-${money(d)}</span></div><h2 style="text-align:right">TOTAL ${money(t)}</h2><p>Payment: ${$('pay').value}</p><p>Thank you!</p></div>`;window.print()}
async function addMenu(){let name=$('mn').value.trim(),price=+$('mp').value;if(!name)return alert('Item name');await api('/api/menu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price})});$('mn').value='';$('mp').value='';load()}
async function edit(id){let x=M.find(a=>a.id==id),name=prompt('Item name',x.name),price=prompt('Price',x.price);if(name&&price!==null)await api('/api/menu/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price:+price})});load()}
async function del(id){if(confirm('Delete item?')){await api('/api/menu/'+id,{method:'DELETE'});load()}}
function menuList(){$('menuList').innerHTML=M.length?M.map(x=>`<div class=item>${x.name} — <b>${money(x.price)}</b><span><button onclick=edit(${x.id})>Edit</button> <button class=danger onclick=del(${x.id})>Delete</button></span></div>`).join(''):'<p class=muted>No menu items.</p>'}
function history(){let q=($('search').value||'').toLowerCase();$('historyList').innerHTML=B.filter(x=>(x.bill_no+x.customer+x.table_no).toLowerCase().includes(q)).map(x=>`<div class=item><span><b>${x.bill_no}</b><br>${x.date}<br>${x.customer||'Walk-in'} · ${x.payment}</span><b>${money(x.total)}</b></div>`).join('')||'<p class=muted>No bills.</p>'}
function dashboard(){let day=new Date().toLocaleDateString('en-IN'),x=B.filter(b=>String(b.date).startsWith(day)),s=x.reduce((a,b)=>a+b.total,0);$('sales').textContent=money(s);$('count').textContent=x.length;$('avg').textContent=money(x.length?s/x.length:0)}
function fresh(){C=[];$('customer').value='';$('table').value='';$('disc').value=0;load();tab('bill')}
function tab(x){['dash','bill','menu','hist'].forEach(a=>$(a).classList.toggle('hide',a!==x));['a','b','c','d'].forEach((z,i)=>$(z).classList.toggle('active',['dash','bill','menu','hist'][i]===x))}
load();
</script></body></html>
